# Sul VPS: copiare .env.example in .env, compilarlo, poi `docker compose up -d --build`.
# Il sito è pubblicato da Caddy (caddy-docker-proxy) tramite le label del servizio "sito"
# sulla rete esterna "caddy": Caddy ottiene e rinnova i certificati da solo.
services:
  sito:
    build: .
    image: tiziana-guerra-art:latest
    container_name: tiziana-guerra-art
    restart: unless-stopped
    # Pubblicato da Caddy (caddy-docker-proxy) tramite le label: HTTPS e certificati li gestisce Caddy.
    networks:
      - default
      - caddy
    labels:
      caddy: tizianaguerra.art, www.tizianaguerra.art
      caddy.reverse_proxy: "{{upstreams 8080}}"
    depends_on:
      - contatti
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Modulo di contatto → AWS SES. Raggiungibile solo da nginx (nessuna porta esposta).
  contatti:
    build: ./server/contatti
    image: tiziana-guerra-art-contatti:latest
    container_name: tiziana-guerra-art-contatti
    restart: unless-stopped
    env_file: .env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "5m"
        max-file: "3"

networks:
  # rete esterna condivisa con il container di Caddy (caddy-docker-proxy)
  caddy:
    external: true
