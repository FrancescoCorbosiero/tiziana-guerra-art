# Esempio per il VPS. Il container serve il sito su http://127.0.0.1:8080:
# collegarlo al reverse proxy già in uso (che gestisce dominio e HTTPS).
services:
  sito:
    build: .
    image: tiziana-guerra-art:latest
    container_name: tiziana-guerra-art
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
