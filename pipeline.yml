# Istruzioni per la pipeline automatica dello studio (modifiche richieste dalla cliente, build, deploy).
# Deploy manuale durante il rodaggio: una richiesta "deployed" è su main; sul VPS si esegue
# `git pull && docker compose up -d --build` in /srv/tizianaguerra-art. Per questo la chiave "deploy" è omessa.
build: npm ci && npm run build
output_dir: dist
# Perimetro stretto per il rodaggio: solo contenuti. Impaginazione (src/pages, src/components,
# src/layouts, src/styles) da aggiungere dopo le prime richieste.
editable_paths:
  - src/content
  - src/assets/pagine
  - src/config/site.ts
