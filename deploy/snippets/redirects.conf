# Vecchi indirizzi del sito WordPress → nuovo sito.
# ⚠️ Da completare dopo l'import dei contenuti, con l'elenco reale degli URL WordPress
#    (così Google e i link esistenti non finiscono su una pagina 404).

# Esempi (da verificare/adattare):
# location ~ ^/portfolio-item/([^/]+)/?$ { return 301 /pitture/$1/; }
# location ~ ^/portfolio-category/([^/]+)/?$ { return 301 /pitture/tema/$1/; }
# location = /home/ { return 301 /; }

# File e aree di WordPress che non esistono più: 410 = "rimosso definitivamente"
# (i bot che cercano vulnerabilità PHP smettono prima di insistere).
location ~ ^/(?:wp-admin|wp-includes|wp-content|wp-json)(?:/|$) { return 410; }
location ~ ^/(?:wp-login|xmlrpc|wp-cron|wp-signup|wp-trackback)\.php$ { return 410; }
location ~ \.php$ { return 410; }
location ~ ^/(?:comments/)?feed/?$ { return 410; }
