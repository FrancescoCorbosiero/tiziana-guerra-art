# Vecchi indirizzi del sito WordPress → nuovo sito (redirect permanenti 301, in un solo passaggio).
# Elenco ricavato dalla sitemap e dal menu del sito WordPress.

# Opere: /portfolio-item/<nome>/ → /pitture/<nome>/ (stessi nomi)
rewrite ^/portfolio-item/?$ /pitture/ permanent;
rewrite ^/portfolio-item/([^/]+)/?$ /pitture/$1/ permanent;

# Elenchi
rewrite ^/portfolio/?$ /galleria/ permanent;
rewrite ^/portfolio-tag/pitture/?$ /pitture/ permanent;
rewrite ^/portfolio-tag/verticali/?$ /pitture/ permanent;
rewrite ^/portfolio-category/([^/]+)/?$ /pitture/categoria/$1/ permanent;

# Pagine
rewrite ^/contatti-2/?$ /contatti/ permanent;
rewrite ^/(?:work-in-progress|ciao-mondo|cookie-policy-ue|privacy-policy-3|category/senza-categoria)/?$ / permanent;

# Sitemap di Rank Math → sitemap del nuovo sito
rewrite ^/sitemap_index\.xml$ /sitemap-index.xml permanent;
rewrite ^/[a-z-]+-sitemap\.xml$ /sitemap-index.xml permanent;

# File e aree di WordPress che non esistono più: 410 = "rimosso definitivamente"
# (i bot che cercano vulnerabilità PHP smettono prima di insistere).
location ~ ^/(?:wp-admin|wp-includes|wp-content|wp-json)(?:/|$) { return 410; }
location ~ ^/(?:wp-login|xmlrpc|wp-cron|wp-signup|wp-trackback)\.php$ { return 410; }
location ~ \.php$ { return 410; }
location ~ ^/(?:comments/)?feed/?$ { return 410; }
