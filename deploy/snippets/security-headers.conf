# Intestazioni di sicurezza (incluse in ogni location: in nginx gli add_header non si ereditano).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# L'unico dominio esterno è alpacode.it, per il badge "Realizzato da Alpacode" nel piè di pagina
# (script, ed eventuali immagini e font del badge). Se si attiva un modulo di contatto esterno,
# il suo dominio è già coperto da "form-action https:".
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'inline-speculation-rules' https://alpacode.it; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://alpacode.it; font-src 'self' https://alpacode.it; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'none'" always;
