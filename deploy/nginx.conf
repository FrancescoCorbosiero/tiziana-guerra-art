# Tiziana Guerra Art — sito statico servito da nginx (immagine non privilegiata, porta 8080).
# HTTPS (certificati) e HSTS vanno gestiti dal reverse proxy davanti al container
# (Traefik, Caddy, nginx-proxy, …), come già avviene per il WordPress attuale.

# IP del visitatore: l'ultimo indirizzo aggiunto dal reverse proxy davanti al container
map $http_x_forwarded_for $client_ip {
    ""                       $remote_addr;
    "~(?<ultimo>[^,\s]+)\s*$" $ultimo;
}

# Log senza dati personali: IP troncato (ultimo blocco azzerato), niente query string
map $client_ip $ip_anonimo {
    "~(?<rete>\d+\.\d+\.\d+)\.\d+$"           $rete.0;
    "~^(?<rete6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*)" $rete6::;
    default                                       -;
}
log_format anonimo '$ip_anonimo [$time_local] "$request_method $uri" $status $body_bytes_sent';

# Modulo di contatto: al massimo 6 invii al minuto per IP (protezione da abusi)
limit_req_zone $client_ip zone=contatti:1m rate=6r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    access_log /var/log/nginx/access.log anonimo;
    # Redirect relativi: funzionano correttamente dietro al reverse proxy HTTPS.
    absolute_redirect off;

    charset utf-8;
    charset_types text/css application/javascript application/json text/plain text/xml application/xml image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    # Vecchi indirizzi del sito WordPress
    include /etc/nginx/snippets/redirects.conf;

    # Indirizzi senza "/" finale → versione canonica con "/" (es. /pitture → /pitture/),
    # escluso il modulo di contatto (/api/…): un redirect farebbe perdere il messaggio.
    rewrite ^((?!/api/)[^.?]*[^/])$ $1/ permanent;

    # Modulo di contatto → servizio "contatti" (docker-compose). Risolto a ogni richiesta, così
    # nginx parte anche se il servizio non c'è (in quel caso il modulo mostra la pagina di errore).
    location = /api/contatti {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=contatti burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $contatti http://contatti:3000;
        proxy_pass $contatti;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        error_page 429 502 503 504 /contatti/errore/index.html;
    }

    # File con hash nel nome (CSS, JS, font, immagini ottimizzate): non cambiano mai.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Favicon, robots.txt, sitemap, indice di ricerca
    location ~* \.(?:svg|png|ico|txt|xml|json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Pagine HTML: sempre aggiornate dopo un nuovo deploy
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        internal;
    }
}
